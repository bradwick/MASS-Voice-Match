<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="256" height="256" fill="#0d47a1"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#64B5F6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1565C0;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Glow effect background -->
  <circle cx="128" cy="128" r="120" fill="url(#glowGradient)"/>
  
  <!-- Microphone body -->
  <rect x="105" y="60" width="46" height="50" rx="23" fill="#FFD600"/>
  
  <!-- Microphone grid -->
  <circle cx="128" cy="85" r="20" fill="none" stroke="#FBC02D" stroke-width="2"/>
  <line x1="128" y1="65" x2="128" y2="105" stroke="#FBC02D" stroke-width="1.5" opacity="0.6"/>
  <line x1="108" y1="85" x2="148" y2="85" stroke="#FBC02D" stroke-width="1.5" opacity="0.6"/>
  <line x1="115" y1="72" x2="141" y2="98" stroke="#FBC02D" stroke-width="1.5" opacity="0.6"/>
  <line x1="141" y1="72" x2="115" y2="98" stroke="#FBC02D" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Microphone stand -->
  <path d="M 120 110 L 115 140" stroke="#FFD600" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M 136 110 L 141 140" stroke="#FFD600" stroke-width="5" fill="none" stroke-linecap="round"/>
  
  <!-- Microphone base -->
  <rect x="110" y="138" width="36" height="8" rx="4" fill="#FFD600"/>
  
  <!-- Sound waves - left side -->
  <path d="M 85 75 Q 75 85 85 95" stroke="#64B5F6" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 70 65 Q 55 85 70 105" stroke="#42A5F5" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Sound waves - right side -->
  <path d="M 171 75 Q 181 85 171 95" stroke="#64B5F6" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 186 65 Q 201 85 186 105" stroke="#42A5F5" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Waveform visualization -->
  <g opacity="0.7">
    <!-- Left channel -->
    <path d="M 50 160 L 55 155 L 60 165 L 65 150 L 70 170 L 75 155 L 80 160" 
          stroke="#2196F3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Center channel -->
    <path d="M 110 160 L 115 148 L 120 172 L 125 145 L 130 175 L 135 145 L 140 172 L 145 148 L 150 160" 
          stroke="#64B5F6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right channel -->
    <path d="M 176 160 L 181 155 L 186 165 L 191 150 L 196 170 L 201 155 L 206 160" 
          stroke="#2196F3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Match indicator circles at bottom -->
  <circle cx="80" cy="210" r="12" fill="none" stroke="#64B5F6" stroke-width="2" opacity="0.7"/>
  <circle cx="128" cy="210" r="12" fill="#64B5F6" opacity="0.8"/>
  <circle cx="176" cy="210" r="12" fill="none" stroke="#64B5F6" stroke-width="2" opacity="0.7"/>
  
  <!-- Decorative elements - matching indicator lines -->
  <line x1="80" y1="200" x2="80" y2="195" stroke="#64B5F6" stroke-width="1.5" opacity="0.5"/>
  <line x1="128" y1="200" x2="128" y2="190" stroke="#64B5F6" stroke-width="2" opacity="0.8"/>
  <line x1="176" y1="200" x2="176" y2="195" stroke="#64B5F6" stroke-width="1.5" opacity="0.5"/>
</svg>
